name: Generate profile cards

# Builds every self-hosted image used in README.md (snake, stats, top languages)
# and publishes them together to the `output` branch. They must be built in one
# job because publishing replaces the whole contents of that branch.

on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17 (off the hour, so GitHub queues it less)
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate stats and top-languages cards
        # Must run before the snake step: snk runs as root in Docker and would
        # otherwise create dist/ with permissions this step cannot write to.
        run: python3 scripts/generate_cards.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
